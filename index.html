    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).reduce(function(acc, s) {
            var parts = s.split('=');
            acc[parts[0]] = parts[1] && decodeURIComponent(parts[1].replace(/\+/g, ' '));
            return acc;
          }, {});
          if (decoded.p !== undefined) {
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + (decoded.p || '') +
                (decoded.q ? '?' + decoded.q : '') +
                l.hash
            );
          }
        }
      }(window.location));
    </script>
    <script type="module" crossorigin src="./dist/assets/index-B_hAj7YO.js"></script>

    <script>
      // YouTube Playables SDK Mock - Enhanced for FRVR and others
      const noop = () => {};
      const noopPromise = () => Promise.resolve({});
      
      window.ytgame = {
        system: {
          getLanguage: () => 'en',
          isAudioEnabled: () => true,
          onPause: (cb) => {
            console.log('ytgame.system.onPause registered');
            if (typeof cb === 'function') window._ytPauseCb = cb;
            return { unsubscribe: noop };
          },
          onResume: (cb) => {
            console.log('ytgame.system.onResume registered');
            if (typeof cb === 'function') window._ytResumeCb = cb;
            return { unsubscribe: noop };
          },
          loadData: noopPromise,
          saveData: noopPromise,
          sendScore: noop,
          setGameReady: noop,
          getSDKVersion: () => '1.0.0',
        },
        game: {
          firstClick: noop,
          gameReady: noop,
          loadFinished: noop
        },
        engagement: {
          sendEvent: noop
        }
      };
      
      // Also expose on parent for iframe access
      if (window.parent && window.parent !== window) {
        window.parent.ytgame = window.ytgame;
      }
    </script>
